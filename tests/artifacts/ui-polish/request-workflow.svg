<svg xmlns="http://www.w3.org/2000/svg" width="973" height="383" viewBox="21 31 973 383" role="img" aria-label="Diagram"><style>.diagram-zone&gt;rect{fill:#eef2f6;fill-opacity:.8;stroke:var(--zone-border,#94a3b8);stroke-width:1;stroke-dasharray:3 3}.diagram-zone&gt;.zone-header{fill:#e2e8f0;fill-opacity:.7;stroke:none}.zone-title&gt;.zone-label-backing{fill:#e2e8f0;fill-opacity:.72;stroke:none}.zone-label{fill:#475569;font:12px system-ui,sans-serif}.diagram-node&gt;.node-shape{fill:#fff;stroke:var(--diagram-ink,#64748b);stroke-width:1.3}.diagram-node text{fill:#1e293b;font:13px system-ui,sans-serif}.edge-line{fill:none;stroke:var(--diagram-ink,#64748b);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}.edge-label rect{fill:var(--label-fill,#fff);stroke:var(--label-border,#e2e8f0);stroke-width:.7}.edge-label text{fill:var(--label-text,#475569);font:11px system-ui,sans-serif}.node-container-title text{font-family:system-ui,sans-serif}</style><rect x="21" y="31" width="973" height="383" fill="#fff"/><g id="diagram-scene" data-theme="clean" style="--diagram-ink:#64748b;--zone-border:#94a3b8;--label-border:#e2e8f0;--label-fill:#ffffff;--label-text:#475569"><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs><g><g class="diagram-zone" data-object-id="Services" data-kind="zone" aria-label="Zone: Delivery services"><rect x="230" y="55" width="410" height="335" rx="4" style="fill:#eef2f6"/><rect class="zone-header" x="230" y="55" width="410" height="32" rx="4" data-zone-header="Services" style="fill:#d9dce0"/></g><g class="diagram-zone" data-object-id="Data" data-kind="zone" aria-label="Zone: Data and processing"><rect x="700" y="55" width="270" height="335" rx="4" style="fill:#eef2f6"/><rect class="zone-header" x="700" y="55" width="270" height="32" rx="4" data-zone-header="Data" style="fill:#d9dce