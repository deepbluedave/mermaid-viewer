<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Diagram Studio responsive review</title>
<style>body{margin:0;min-height:100vh;background:#070c14;color:#9aacc3;font:12px system-ui;display:flex;align-items:center;flex-direction:column}header{display:flex;align-items:center;gap:12px;padding:8px;height:40px;box-sizing:border-box}select{background:#172439;color:#e2e8f0;border:1px solid #334155;border-radius:4px;padding:3px}iframe{border:1px solid #273348;border-radius:6px;flex-shrink:0;display:block;background:#0b1220}</style>
<header><span>Responsive review</span><label>Width <select id="width"><option>320</option><option>390</option><option>600</option><option>850</option><option>1024</option><option>1280</option><option>1800</option></select></label><span id="dimensions"></span></header>
<iframe id="app" src="../viewer.html?v=refinements" title="Diagram Studio"></iframe>
<script>const params=new URLSearchParams(location.search),frame=document.getElementById('app'),width=document.getElementById('width'),height=Math.max(500,Math.min(1100,Number(params.get('height'))||660));width.value=['320','390','600','850','1024','1280','1800'].includes(params.get('width'))?params.get('width'):'390';function resize(){frame.style.width=width.value+'px';frame.style.height=height+'px';document.getElementById('dimensions').textContent=width.value+' × '+height;}width.addEventListener('change',resize);resize();</script></html>
